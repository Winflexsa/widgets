<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PET Chivilcoy</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0e7a49">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ee;--card:#ffffff;--line:#dde4dd;--ink:#19211b;--mut:#5c665e;--gris:#5d5d5d;
 --g:#15a463;--gd:#0e7a49;--gdd:#0a5e38;--gl:#e4f6ec;--track:#e5ebe5;--mid:#b07d13;--midl:#fbf1da;--bad:#a33b3b;--badl:#f7e6e6;
 --tb-h:env(titlebar-area-height,0px);--tb-w:env(titlebar-area-width,100%)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1411;--card:#171e19;--line:#27322a;--ink:#e6ece7;--mut:#9aa69c;--gris:#c3cac4;
 --g:#3fc585;--gd:#157a4b;--gdd:#3fc585;--gl:#16301f;--track:#26312a;--mid:#e0a93e;--midl:#33290f;--bad:#e06a6a;--badl:#3a1a1a}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:600 12.5px/1.3 Nunito,system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow-y:auto}
/* Barra superior: ocupa la barra de título cuando la ventana está en modo sin barra */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:7px;background:var(--gd);color:#fff;
 height:max(30px,var(--tb-h));width:var(--tb-w);padding:0 8px;-webkit-app-region:drag;app-region:drag;user-select:none}
header img{height:15px;width:auto}
header h1{font-size:13.5px;font-weight:800;white-space:nowrap}
header .tur{font-size:11.5px;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{padding:6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:6px}
.alert{border-radius:12px;padding:5px 9px;margin-bottom:6px;font-size:12px;display:flex;gap:6px;align-items:center}
.alert>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.alert.bad{background:var(--badl);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.alert.mid{background:var(--midl);border:1px solid color-mix(in srgb,var(--mid) 35%,transparent)}
.prod+.prod{margin-top:8px}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.pname{font-weight:800;font-size:14px;color:var(--gris)}
.pct{font-size:26px;font-weight:800;line-height:1}
.sub{color:var(--mut);font-size:11.5px}
.bar{position:relative;height:8px;background:var(--track);border-radius:999px;margin:5px 0 3px}
.bar i{display:block;height:100%;border-radius:999px}
.bar b{position:absolute;top:-2px;width:3px;height:12px;border-radius:999px;background:var(--ink);opacity:.6}
.warn{color:var(--bad);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px}
.chip{background:var(--gl);border-radius:12px;padding:4px 8px;line-height:1.15}
.chip.neg{background:var(--badl)}
.chip .n{font-size:11px;font-weight:800;color:var(--gris)}
.chip .p{font-size:16px;font-weight:800;color:var(--gdd)}
.chip.neg .p{color:var(--bad)}
.chip .p small{font-size:10.5px;font-weight:700;opacity:.8}
.chip .u{font-size:10.5px;color:var(--mut)}
.empty{color:var(--mut);font-size:12px}
footer{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:11px;padding:0 3px}
footer button,footer a{font:inherit;font-weight:800;color:var(--gd);background:none;border:0;cursor:pointer;text-decoration:none;padding:2px 5px;border-radius:999px}
@media (prefers-color-scheme:dark){footer button,footer a{color:var(--g)}}
footer button:hover,footer a:hover{background:var(--gl)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin-right:4px}
.dot.ok{background:var(--g)}.dot.err{background:var(--bad)}.dot.load{background:var(--mid)}

.ptitle{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:800;color:var(--gd);margin-bottom:4px}
@media (prefers-color-scheme:dark){.ptitle{color:var(--g)}}
.ptitle span{color:var(--mut);font-weight:700}
.pw table{width:100%;border-collapse:collapse}
.pw td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
.pw tr:last-child td{border-bottom:0}
.pw td.r{text-align:right;white-space:nowrap}
.pw .u{font-size:10.5px;color:var(--mut);font-weight:600}
.pw .u .warn{color:var(--bad);font-weight:800}
</style>
</head>

<div class="wrap pw">
<div class="box" id="pc-turno"><p class="empty">Cargando…</p></div>
<div class="box"><div class="ptitle">Pedidos pendientes<span id="pc-pend-t"></span></div><div id="pc-pend"><p class="empty">Cargando…</p></div></div>
<footer><span><span class="dot load" id="pc-dot"></span><span id="pc-upd">Conectando…</span></span><span><button id="pc-btn" title="Actualizar ahora">↻</button><a href="https://winflexsa.github.io/winflex-pet-chivilcoy/" target="_blank" rel="noopener">Abrir app ↗</a></span></footer>
</div>
<script>
(()=>{
// ══════════ Widget PET Chivilcoy ══════════
const GIST_ID='07265bb8a6c36ddcfffa6a7441095eb4';
const REFRESCO_MIN=5;
const PEND=['OC','OP','En producción','Parcial'];
const q=id=>document.getElementById('pc-'+id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kg=n=>(Math.round(n)||0).toLocaleString('es-AR');
const hhmm=d=>d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
const dur=m=>m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');
let D=null;

async function bajar(){
  const bust='?t='+Date.now();
  let owner=null;try{owner=localStorage.getItem('wfw_pet_owner');}catch(_){}
  if(owner){
    try{const r=await fetch(`https://gist.githubusercontent.com/${owner}/${GIST_ID}/raw/winflex.json${bust}`,{cache:'no-store'});
      if(r.ok)return JSON.parse(await r.text());}catch(_){}
  }
  // primera vez (o si falló): API de GitHub, con el token de la app si este navegador lo tiene
  let tok=null;try{const c=JSON.parse(localStorage.getItem('winflex_gist_credentials')||'null');tok=c&&c.token;}catch(_){}
  const h={'Accept':'application/vnd.github+json'};if(tok)h.Authorization='token '+tok;
  const r=await fetch('https://api.github.com/gists/'+GIST_ID,{headers:h,cache:'no-store'});
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();const f=j.files&&j.files['winflex.json'];if(!f)throw new Error('sin winflex.json');
  if(j.owner&&j.owner.login){try{localStorage.setItem('wfw_pet_owner',j.owner.login);}catch(_){}}
  let txt=f.content;
  if(f.truncated){const rr=await fetch(f.raw_url,{cache:'no-store'});if(!rr.ok)throw new Error('raw '+rr.status);txt=await rr.text();}
  return JSON.parse(txt);
}
// pedidos pueden venir con nombres cortos
const MAP={fi:'fechaIngreso',fd:'fechaDespacho',fe:'fechaEntrega',cl:'cliente',med:'medida',col:'color',pt:'partida',kp:'kgPedidos',kr:'kgReales',a:'ancho',e:'espesor',ew:'estadoWorkflow',eds:'estadoDespacho',prd:'producto',kph:'kgPorHora',no:'nroOP'};
function largo(p){if(!p||'cliente' in p||'kgPedidos' in p)return p;const o={};for(const k in p)o[MAP[k]||k]=p[k];return o;}

// momento real de cada bobina: fecha local del timestamp + hora cargada
function momento(b){
  const t=b.timestamp?new Date(b.timestamp):(b.fecha?new Date(b.fecha+'T12:00'):null);if(!t||isNaN(t))return null;
  const m=/^(\d{1,2}):(\d{2})/.exec(b.hora||'');if(!m)return t;
  const d=new Date(t);d.setHours(+m[1],+m[2],0,0);
  if(d-t>3*3600e3)d.setDate(d.getDate()-1);   // hora de antes de medianoche cargada después
  return d;
}
function turno(now){
  const c=(D&&D.config&&D.config.horarioTurnoDia)||{inicio:6,fin:18};const ini=+c.inicio||6,fin=+c.fin||18;
  const h=now.getHours(),base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(h>=ini&&h<fin){const a=new Date(base);a.setHours(ini);const b=new Date(base);b.setHours(fin);return {n:'Día',a,b};}
  const a=new Date(base);if(h<ini)a.setDate(a.getDate()-1);a.setHours(fin);const b=new Date(a);b.setHours(b.getHours()+(24-(fin-ini)));return {n:'Noche',a,b};
}

function render(){
  const now=new Date(),T=turno(now);
  q('tur').textContent=T.n+' · '+T.a.toLocaleDateString('es-AR',{day:'numeric',month:'numeric'});
  const peds=(D.pedidos||[]).map(largo);const pm={};peds.forEach(p=>pm[p.id]=p);
  const bobs=(D.producciones||[]).map(b=>({b,t:momento(b)})).filter(x=>x.t);
  const enT=bobs.filter(x=>x.t>=T.a&&x.t<T.b).sort((x,y)=>y.t-x.t);
  const ult=bobs.slice().sort((x,y)=>y.t-x.t)[0];
  let h='';
  if(!enT.length){
    h=`<p class="empty">Sin bobinas en este turno.${ult?'<br>Última: '+ult.t.toLocaleString('es-AR',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})+(pm[ult.b.pedidoId]?' · '+esc(pm[ult.b.pedidoId].cliente):''):''}</p>`;
  }else{
    const tot=enT.reduce((s,x)=>s+(+x.b.kg||0),0);
    const hs=Math.max(0.25,(Math.min(now,T.b)-T.a)/3600e3);
    const kph=tot/hs;
    const p=pm[enT[0].b.pedidoId]||{};const obj=+p.kgPorHora||0;const e=obj>0?Math.round(kph/obj*100):null;
    const col=e==null?'var(--gris)':e>=100?'var(--g)':e>=80?'var(--mid)':'var(--bad)';
    const minSin=Math.round((now-enT[0].t)/60000);
    h=`<div class="prow"><span class="pname">${kg(tot)} kg</span>${e!=null?`<span class="pct" style="color:${col}">${e}%</span>`:''}</div>
    ${e!=null?`<div class="bar"><i style="width:${Math.min(100,e)}%;background:${col}"></i></div>`:''}
    <div class="sub">${enT.length} bobina${enT.length>1?'s':''} · ${kg(kph)} kg/h${obj?' de '+kg(obj)+' objetivo':''}</div>
    <div class="sub" title="${esc([p.cliente,p.medida,p.color].filter(Boolean).join(' · '))}">En máquina: <b>${esc(p.cliente||'—')}</b>${p.medida?' · '+esc(p.medida):''}</div>
    <div class="sub${minSin>60?' warn':''}" style="margin-top:3px">Última bobina hace ${dur(minSin)}</div>`;
  }
  q('turno').innerHTML=h;

  const hoy=now.toISOString().slice(0,10);
  const pend=peds.filter(p=>PEND.includes(p.estadoWorkflow)).map(p=>({p,f:Math.max(0,(+p.kgPedidos||0)-(+p.kgReales||0))})).filter(x=>x.f>0)
    .sort((a,b)=>(a.p.fechaEntrega||'9999').localeCompare(b.p.fechaEntrega||'9999'));
  const totF=pend.reduce((s,x)=>s+x.f,0);
  q('pend-t').textContent=pend.length?`${pend.length} · ${kg(totF)} kg`:'';
  q('pend').innerHTML=pend.length?'<table>'+pend.slice(0,5).map(x=>{const fe=x.p.fechaEntrega||'';const venc=fe&&fe<hoy;
    return `<tr><td><b>${esc(x.p.cliente||'—')}</b><div class="u">${esc(x.p.medida||'')}${fe?' · <span class="'+(venc?'warn':'')+'">'+fe.slice(8,10)+'/'+fe.slice(5,7)+'</span>':''}</div></td><td class="r"><b>${kg(x.f)}</b> <span class="u">kg</span></td></tr>`;}).join('')+'</table>'+(pend.length>5?`<div class="u" style="margin-top:3px">y ${pend.length-5} más</div>`:''):'<p class="empty">Sin pedidos pendientes.</p>';
}

let cargando=false;
async function cargar(){
  if(cargando)return;cargando=true;q('dot').className='dot load';
  try{D=await bajar();render();q('dot').className='dot ok';q('upd').textContent=hhmm(new Date());}
  catch(e){q('dot').className='dot err';q('upd').textContent='Sin conexión ('+e.message+')';console.error(e);}
  finally{cargando=false;}
}
q('btn').onclick=cargar;
setInterval(()=>{if(document.visibilityState==='visible')cargar();},REFRESCO_MIN*60000);
setInterval(()=>{if(D)render();},60000);
cargar();
})();

</script>
