<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronograma</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0e7a49">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ee;--card:#ffffff;--line:#dde4dd;--ink:#19211b;--mut:#5c665e;--gris:#5d5d5d;
 --g:#15a463;--gd:#0e7a49;--gdd:#0a5e38;--gl:#e4f6ec;--track:#e5ebe5;--mid:#b07d13;--midl:#fbf1da;--bad:#a33b3b;--badl:#f7e6e6;
 --tb-h:env(titlebar-area-height,0px);--tb-w:env(titlebar-area-width,100%)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1411;--card:#171e19;--line:#27322a;--ink:#e6ece7;--mut:#9aa69c;--gris:#c3cac4;
 --g:#3fc585;--gd:#157a4b;--gdd:#3fc585;--gl:#16301f;--track:#26312a;--mid:#e0a93e;--midl:#33290f;--bad:#e06a6a;--badl:#3a1a1a}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:600 12.5px/1.3 Nunito,system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow-y:auto}
/* Barra superior: ocupa la barra de título cuando la ventana está en modo sin barra */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:7px;background:var(--gd);color:#fff;
 height:max(30px,var(--tb-h));width:var(--tb-w);padding:0 8px;-webkit-app-region:drag;app-region:drag;user-select:none}
header img{height:15px;width:auto}
header h1{font-size:13.5px;font-weight:800;white-space:nowrap}
header .tur{font-size:11.5px;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{padding:6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:6px}
.alert{border-radius:12px;padding:5px 9px;margin-bottom:6px;font-size:12px;display:flex;gap:6px;align-items:center}
.alert>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.alert.bad{background:var(--badl);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.alert.mid{background:var(--midl);border:1px solid color-mix(in srgb,var(--mid) 35%,transparent)}
.prod+.prod{margin-top:8px}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.pname{font-weight:800;font-size:14px;color:var(--gris)}
.pct{font-size:26px;font-weight:800;line-height:1}
.sub{color:var(--mut);font-size:11.5px}
.bar{position:relative;height:8px;background:var(--track);border-radius:999px;margin:5px 0 3px}
.bar i{display:block;height:100%;border-radius:999px}
.bar b{position:absolute;top:-2px;width:3px;height:12px;border-radius:999px;background:var(--ink);opacity:.6}
.warn{color:var(--bad);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px}
.chip{background:var(--gl);border-radius:12px;padding:4px 8px;line-height:1.15}
.chip.neg{background:var(--badl)}
.chip .n{font-size:11px;font-weight:800;color:var(--gris)}
.chip .p{font-size:16px;font-weight:800;color:var(--gdd)}
.chip.neg .p{color:var(--bad)}
.chip .p small{font-size:10.5px;font-weight:700;opacity:.8}
.chip .u{font-size:10.5px;color:var(--mut)}
.empty{color:var(--mut);font-size:12px}
footer{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:11px;padding:0 3px}
footer button,footer a{font:inherit;font-weight:800;color:var(--gd);background:none;border:0;cursor:pointer;text-decoration:none;padding:2px 5px;border-radius:999px}
@media (prefers-color-scheme:dark){footer button,footer a{color:var(--g)}}
footer button:hover,footer a:hover{background:var(--gl)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin-right:4px}
.dot.ok{background:var(--g)}.dot.err{background:var(--bad)}.dot.load{background:var(--mid)}

.crw .nav{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.crw .nav button{font:inherit;font-weight:800;border:0;background:var(--card);border:1px solid var(--line);color:var(--gd);border-radius:999px;cursor:pointer;padding:2px 9px}
@media (prefers-color-scheme:dark){.crw .nav button{color:var(--g)}}
.crw .nav .dl{flex:1;text-align:center;font-size:12.5px;color:var(--ink);font-weight:600}
.crw .nav .dl b{color:var(--gd)}
@media (prefers-color-scheme:dark){.crw .nav .dl b{color:var(--g)}}
.crw .sh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--gd);margin-bottom:4px}
@media (prefers-color-scheme:dark){.crw .sh{color:var(--g)}}
.crw .sh a{margin-left:auto;font-size:10.5px;color:var(--mut);text-decoration:none}
.crw .tr{display:flex;gap:6px}.crw .tr+.tr{margin-top:5px}
.crw .tt{flex:0 0 62px;font-size:11px;font-weight:800;color:var(--gris);padding-top:4px;line-height:1.2}
.crw .tt small{display:block;font-weight:600;color:var(--mut);font-size:9.5px}
.crw .ti{flex:1;min-width:0}
.crw .it{background:var(--gl);border-radius:10px;padding:4px 8px}.crw .it+.it{margin-top:4px}
.crw .it.ev{background:var(--midl);font-size:11.5px;font-weight:700}
.crw .il{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;font-size:12px}
.crw .il b{color:var(--ink)}
.crw .op{font-size:10.5px;color:var(--mut);font-weight:600}
.crw .mb{height:6px;background:var(--track);border-radius:999px;margin:3px 0 1px}
.crw .mb i{display:block;height:100%;border-radius:999px}
.crw .rv{font-size:10.5px;font-weight:800;color:var(--gdd)}
.crw .ob{font-size:10.5px;color:var(--mut);font-style:italic}
</style>
</head>

// REGLA: con recuento cargado, el recuento MANDA. Un movimiento cuenta solo si es posterior:
//  - fecha posterior al dia del recuento, o

function movsPost(p){
  const c=corteReal(p);const out=[];const atr=[];
  DB.bobinas.forEach(b=>{if(b.prod!==p)return;const ts=tsCarga(b);if(posterior(c,b.fecha,ts))out.push({t:'prod',uxp:+b.uxp||0,uds:b.uds||0,ref:b});else if(atrasado(c,b.fecha,ts))atr.push({t:'Producción',fecha:b.fecha,uds:b.uds||0,uxp:+b.uxp||0,ref:b});});

      ls.forEach(l=>{if(!l.uds)return;if(posterior(c,e.fecha,te))out.push({t:'vend',uxp:l.uxp,uds:l.uds,ref:x});else if(atrasado(c,e.fecha,te))atr.push({t:'Entrega',fecha:e.fecha,uds:l.uds,uxp:l.uxp,cliente:x.cliente,ref:x});});});
  });
  (DB.ajustes||[]).forEach(a=>{if(a.prod!==p||(a.motivo||'').startsWith('Establecer stock real'))return;const ts=a.mod||tsCarga(a);if(posterior(c,a.fecha,ts))out.push({t:'aj',uxp:+a.uxp||0,uds:a.cantidad||0,ref:a});else if(atrasado(c,a.fecha,ts))atr.push({t:'Ajuste',fecha:a.fecha,uds:a.cantidad||0,uxp:+a.uxp||0,ref:a});});

function stockByBox(p){

  const m={};
  const ensure=u=>{if(!m[u])m[u]={uxp:+u,uds:0,cpp:cajasXPallet(p,+u)||0};return m[u];};
  if(real)real.forEach(x=>{const u=+x.uxp||0;if(!u)return;const e=ensure(u);e.uds+=(+x.cajas||0)*u;if(+x.cpp>0)e.cpp=+x.cpp;});

  let arr=Object.values(m).filter(x=>x.uxp>0);

  const asignado=arr.reduce((s,x)=>s+x.uds,0);
  if(!real)resid=sa-asignado; // sin recuento: stock inicial, ajustes viejos, etc.
  arr.sort((a,b)=>b.uxp-a.uxp);

  if(Math.abs(resid)>=1)out.push({uxp:0,sinFmt:true,frac:sa?resid/sa:0,stU:Math.round(resid),stC:0,stP:0,cpp:0});
  return out;
}

      const src=m==='Laminadora'?lam.filter(l=>!l.resto&&l.tipo!=='PET'):fin.filter(x=>x.maq===m.replace('Refiladora ',''));
      const r=c.ocId?src.filter(x=>x.ocId===c.ocId&&deF(x.createdAt)).reduce((s,x)=>s+(+x.kg||0),0):0;
      return `<div class="it"><div class="il"><b>${o.id?esc(o.cliente)+' · OC '+esc(o.nro):esc(c.nota||'—')}</b><span class="op">${esc(c.turno||'')}${c.operario?' · 👷 '+esc(c.operario):''}</span></div>${c.ocId?prog(kg(r),+c.kgObj||0,'kg'):''}${o.id&&c.nota?`<div class="ob">${esc(c.nota)}</div>`:''}</div>`;}).join('')}</div></div>`;}).join('')||'<p class="empty">Sin planificar</p>';
}
function render(){
  const d=new Date();d.setDate(d.getDate()+off);const f=ymd(d);
  const lbl=off===0?'Hoy':off===1?'Mañana':off===-1?'Ayer':'';
  q('dia').innerHTML=`${lbl?'<b>'+lbl+'</b> · ':''}${d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'numeric'})}`;
  q('hoy').style.visibility=off?'visible':'hidden';
  q('t').innerHTML=secTermo(f,off===0);q('p').innerHTML=secPet(f);q('l').innerHTML=secLam(f);
}
async function jb(bin){const r=await fetch('https://api.jsonbin.io/v3/b/'+bin+'/latest',{headers:{'X-Master-Key':KEY,'X-Bin-Meta':'false'},cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();return j.record||j;}
let cargando=false;
async function cargar(){
  if(cargando)return;cargando=true;q('dot').className='dot load';
  const res=await Promise.allSettled([jb(TERMO_BIN),bajar(),jb(LR_BIN)]);
  if(res[0].status==='fulfilled'){const r=res[0].value;const drop=(a,t)=>{const s=new Set((t||[]).map(x=>x.id));return (a||[]).filter(x=>x&&!s.has(x.id));};
    Object.assign(DB,{objetivos:(r.objetivos&&r.objetivos.prods)?r.objetivos:null,bobinas:drop(r.bobinas,r.bobinasBorradas),pallets:r.pallets||[],stockConfig:r.stockConfig||{},cronograma:drop(r.cronograma,r.cronogramaBorrados)});ok.t=true;}
  if(res[1].status==='fulfilled'){PET=res[1].value;PET.pedidos=(PET.pedidos||[]).map(largo);ok.p=true;}
  if(res[2].status==='fulfilled'){LR=res[2].value;ok.l=true;}
  const fallas=res.filter(x=>x.status==='rejected').length;
  render();q('dot').className='dot '+(fallas===3?'err':fallas?'load':'ok');
  q('upd').textContent=fallas?`${hhmm(new Date())} · ${fallas} sin conexión`:hhmm(new Date());
  cargando=false;
}
q('prev').onclick=()=>{off--;render();};q('next').onclick=()=>{off++;render();};q('hoy').onclick=()=>{off=0;render();};
q('btn').onclick=cargar;
setInterval(()=>{if(document.visibilityState==='visible')cargar();},REFRESCO_MIN*60000);
setInterval(()=>{if(off===0&&ok.t)render();},5*60000);
// a medianoche vuelve solo a "hoy"
let ultDia=ymd(new Date());setInterval(()=>{const h=ymd(new Date());if(h!==ultDia){ultDia=h;off=0;render();}},60000);
cargar();
})();

</script>
